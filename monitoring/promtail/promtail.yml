server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Descobre os containers pela API do Docker, em vez de ler os arquivos de log
  # direto do disco. É o único jeito de obter o NOME do container: no formato
  # json-file o campo attrs.name não existe (só aparece com --log-opt labels),
  # e o caminho do arquivo carrega apenas o ID.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # __meta_docker_container_name vem com barra inicial: /homeequity-agent
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - target_label: "job"
        replacement: "docker"
